name: Artículo diario (borrador en pull request)

# Genera un artículo con Claude y abre un pull request. Aprobar (merge) el PR es
# lo que lo publica: Vercel despliega solo. Si no se aprueba, no sale nada.
#
# Requisitos (una sola vez):
#  - Secret del repositorio ANTHROPIC_API_KEY
#  - Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests"

on:
  schedule:
    - cron: "0 15 * * 1-5" # lunes a viernes, 9:00 a.m. Ciudad de México
  workflow_dispatch:
    inputs:
      keyword:
        description: "Palabra clave (vacío = siguiente de la cola)"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generar artículo
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KEYWORD: ${{ inputs.keyword }}
        run: |
          if [ -n "$KEYWORD" ]; then npm run articulo:generar -- --keyword "$KEYWORD"; else npm run articulo:generar; fi
      - name: Abrir pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain content/articulos)" ]; then echo "Nada que publicar."; exit 0; fi
          ARCHIVO=$(git status --porcelain content/articulos | grep -v cola.json | awk '{print $2}' | head -1)
          TITULO=$(grep -m1 '^titulo:' "$ARCHIVO" | sed 's/^titulo: //' | tr -d '"')
          RAMA="articulo/$(date +%Y%m%d)-$(basename "$ARCHIVO" .md | cut -c1-40)"
          git config user.name "nasus-articulos[bot]"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$RAMA"
          git add content/articulos
          git commit -m "Artículo: $TITULO"
          git push -u origin "$RAMA"
          gh pr create --title "Artículo: $TITULO" --body "Borrador generado con Claude. Revisa datos, tono y enlaces antes de aprobar: al hacer merge se publica en nasus.mx/articulos. Para descartarlo, cierra el PR (la palabra clave quedará pendiente en la cola solo si borras el commit de cola.json)." --base "${{ github.event.repository.default_branch }}"
